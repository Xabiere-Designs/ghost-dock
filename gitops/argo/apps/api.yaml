apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: api }
spec:
  destination: { namespace: default, server: https://kubernetes.default.svc }
  project: default
  source:
    repoURL: REPLACE_THIS_REPO_URL
    path: helm/app-chart
    targetRevision: HEAD
    helm: { valuesObject: { api: { image: REPLACE_API_IMAGE } } }
  syncPolicy: { automated: { prune: true, selfHeal: true } }
